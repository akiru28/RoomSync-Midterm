<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12355B">
  <title>My Reservations — RoomSync</title>
  <link rel="icon" type="image/png" href="../assets/logos/logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/role-theme.css">
  <style>
    html{scroll-behavior:smooth;scroll-padding-top:68px}
    html,body{overflow-x:hidden}
    body{position:relative}
    body::before,body::after{
      content:"";position:fixed;border-radius:50%;filter:blur(80px);
      opacity:.26;pointer-events:none;z-index:0;
      animation:blob-move 16s ease-in-out infinite alternate;
    }
    body::before{width:360px;height:360px;background:var(--hero-blob-1);top:-140px;right:-100px}
    body::after{width:300px;height:300px;background:var(--hero-blob-2);bottom:-120px;left:-90px;animation-direction:alternate-reverse;animation-duration:18s}
    #app{position:relative;z-index:1}
    #app > main.container{min-height:calc(100vh - 68px)}
    @keyframes blob-move{to{transform:translate(-24px,16px) scale(1.05)}}

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
      html{scroll-behavior:auto}
      .hero-entrance{opacity:1;transform:none}
      .blob,body::before,body::after{animation:none !important}
    }

    .hero-entrance{opacity:0;transform:translateY(16px)}
    .hero-entrance.visible{animation:hero-up .7s var(--ease) both}
    .hero-entrance.d1{animation-delay:.05s}.hero-entrance.d2{animation-delay:.12s}
    @keyframes hero-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body class="role-page">
  <div id="app">
    <!-- header injected -->
    <!-- sidebar injected -->
    <main class="container with-sidebar">
      <header class="page-header hero-entrance d1">
        <div class="page-title-block">
          <span class="eyebrow">Reservations · My Requests</span>
          <h1>My Reservations</h1>
          <p class="lead">Track the status of your submitted reservation requests — approved, pending review, or cancelled.</p>
        </div>
        <div class="page-actions">
          <a class="btn primary" href="reservation.html" data-can-reserve hidden>+ New Reservation</a>
        </div>
      </header>
      <section class="card mt hero-entrance d2">
        <span class="section-label">History</span>
        <div id="my-reservations" class="mt" aria-busy="true">
          <table class="table" aria-hidden="true"><tbody>
            <tr><td><span class="skeleton skeleton-line" style="width:65%"></span></td><td><span class="skeleton skeleton-line" style="width:58%"></span></td><td><span class="skeleton skeleton-line" style="width:76%"></span></td><td><span class="skeleton skeleton-line" style="width:54%"></span></td><td><span class="skeleton skeleton-line" style="width:34%"></span></td><td><span class="skeleton skeleton-line" style="width:48%"></span></td><td><span class="skeleton skeleton-line" style="width:40%"></span></td></tr>
            <tr><td><span class="skeleton skeleton-line" style="width:70%"></span></td><td><span class="skeleton skeleton-line" style="width:52%"></span></td><td><span class="skeleton skeleton-line" style="width:72%"></span></td><td><span class="skeleton skeleton-line" style="width:60%"></span></td><td><span class="skeleton skeleton-line" style="width:38%"></span></td><td><span class="skeleton skeleton-line" style="width:46%"></span></td><td><span class="skeleton skeleton-line" style="width:36%"></span></td></tr>
          </tbody></table>
        </div>
      </section>
    </main>
    <!-- footer injected -->
    <!-- modals injected -->
  </div>
  <script src="../js/components.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/my-reservations.js"></script>
  <script>
    (function(){
      var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
      if(mq.matches){return;}
      var els=document.querySelectorAll('.hero-entrance');
      if(!els.length){return;}
      var run=function(){els.forEach(function(el){el.classList.add('visible');});};
      if('requestAnimationFrame' in window){requestAnimationFrame(function(){requestAnimationFrame(run);});}else{run();}
    })();
  </script>
</body>
</html>
