<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to RoomSync — Room &amp; Laboratory Reservation System for Camarines Sur Polytechnic Colleges.">
  <meta name="theme-color" content="#12355B">
  <title>Sign In</title>
  <link rel="icon" type="image/png" href="../assets/logos/logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* ================================================================
       RoomSync Login Page — Scoped Styles (matches landing page aesthetic)
       Navy Blue + White Professional Theme
       ================================================================ */

    html { scroll-behavior: smooth; }
    html, body {
      height: 100%;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
    }
    body { padding-top: 0; background: #F8FAFC; }

    /* 90° split background: white gradient left, campus image right */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(
  90deg,
  #F8FAFC 0%,
  #F8FAFC 38%,
  rgba(248, 250, 252, 0.96) 45%,
  rgba(248, 250, 252, 0.78) 52%,
  rgba(248, 250, 252, 0.42) 59%,
  rgba(248, 250, 252, 0.10) 66%,
  rgba(248, 250, 252, 0) 72%
),
        url('../assets/images/bg.jpg');
      background-size: auto, cover;
      background-position: 0 0, right center;
      background-repeat: no-repeat;
      filter: saturate(0.9) brightness(0.92);
      transform: scale(1.01);
      pointer-events: none;
    }
/* Soft ambient overlay on the image portion for depth */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
  linear-gradient(
    90deg,
    rgba(15, 23, 42, 0) 55%,
    rgba(15, 23, 42, 0.06) 75%,
    rgba(15, 23, 42, 0.14) 100%
  );
      pointer-events: none;
    }
.splash-wrap {
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .splash-wrap > section { flex: 1 1 auto; min-height: 0; }
    .splash-wrap .landing-footer { display: none; }

    /* ----------------------------------------------------------------
       1. NAVIGATION — Sticky Glass Effect (same as landing)
       ---------------------------------------------------------------- */
    .landing-nav {
      position: fixed; top: 0; z-index: 100;
      padding: 0; width: 100%;
      background: var(--bg);
      backdrop-filter: saturate(160%) blur(18px);
      -webkit-backdrop-filter: saturate(160%) blur(18px);
      transition: box-shadow .3s var(--ease), border-color .3s var(--ease);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    .landing-nav.scrolled {
      box-shadow: var(--shadow-sm);
      border-bottom-color: var(--border-2);
    }
    .landing-nav-inner {
      max-width: 1180px; margin: 0 auto; padding: 14px var(--space-5);
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    }
    .landing-nav .brand-text { font-size: 1.1rem; }
    .landing-nav-links { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .landing-nav-links a {
      text-decoration: none; color: var(--text-2);
      padding: 8px 12px; border-radius: 8px; font-size: var(--fs-sm); font-weight: 500;
      transition: all .18s var(--ease);
    }
    .landing-nav-links a:hover { background: var(--surface-2); color: var(--text); }
    .landing-nav-links a:focus-visible { outline: none; box-shadow: var(--nav-focus); }
    .landing-nav-links a.btn { padding: 8px 14px; }
    .landing-toggle {
      display: none; background: transparent; border: 1px solid var(--border);
      font-size: 1.2rem; padding: 6px 10px; border-radius: 8px; color: var(--text); cursor: pointer;
      line-height: 1;
    }
    .landing-toggle:hover { background: var(--surface-2); }
    .landing-toggle:focus-visible { outline: none; box-shadow: var(--nav-focus); }

    @media (max-width: 768px) {
      .landing-toggle { display: inline-flex; }
      .landing-nav-inner { position: relative; flex-wrap: wrap; }
      .landing-nav-links {
        display: none; width: 100%; flex-direction: column; align-items: stretch; gap: 6px;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: var(--space-4); margin-top: 10px; box-shadow: var(--shadow-lg);
      }
      .landing-nav-links.open { display: flex; }
      .landing-nav-links a { padding: 10px 14px; text-align: center; }
      
    }

    /* ----------------------------------------------------------------
       3. DECORATIVE BLOBS — kept on the image (right) side only
       ---------------------------------------------------------------- */
    .blob {
      position: absolute; border-radius: 50%; filter: blur(70px);
      opacity: .20; pointer-events: none; z-index: 0;
    }
    .blob.b1 {
      width: 300px; height: 300px; background: var(--hero-blob-1);
      top: -120px; right: -100px;
      animation: blob-move 14s ease-in-out infinite alternate;
    }
    .blob.b2 {
      width: 260px; height: 260px; background: var(--hero-blob-2);
      bottom: -100px; right: 18%;
      left: auto;
      animation: blob-move 16s ease-in-out infinite alternate-reverse;
    }
    @keyframes blob-move { to { transform: translate(-30px, 20px) scale(1.05); } }

    /* ----------------------------------------------------------------
       4. LOGIN HERO — TWO-COLUMN LAYOUT
          • LEFT PANEL :  CSPC institutional row pinned to TOP-LEFT,
                           copy stack + form below, vertical centerline.
          • RIGHT PANEL:  Larger RoomSync logo (logo.png) placed at the
                           RIGHT-CENTER of the hero (vertical + horizontal
                           center of its column, slightly toward the image
                           side of the background split).
       ---------------------------------------------------------------- */
    .login-hero {
      position: relative; z-index: 2;
      padding: 24px var(--space-6);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      grid-template-areas: "left right";
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 0;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      column-gap: var(--space-8);
      row-gap: var(--space-6);
      overflow: visible;
    }

    .login-left,
    .login-right {
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
    }

    /* ---- Left column: holds CSPC institutional row (top-left anchored)
            and the stacked login-copy + form, vertically centered. ---- */
    .login-left {
      grid-area: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-top: 84px;
      padding-bottom: var(--space-4);
    }

    /* CSPC institutional strip: pinned to TOP-LEFT corner of the
       LEFT PANEL with proper vertical breathing room. */
    .cspc-institutional {
      position: absolute;
      top: 12px;
      left: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 6px 8px;
      margin: 0;
      width: 100%;
      max-width: 520px;
    }
    .cspc-institutional .seal {
      width: 46px; height: 46px; border-radius: 10px; flex: 0 0 46px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(18, 53, 91, 0.05);
      border: 1px solid rgba(18, 53, 91, 0.12);
      overflow: hidden; flex-shrink: 0;
    }
.cspc-institutional .seal img { width: 72%; height: 72%; object-fit: contain; }
    .cspc-institutional .text {
      display: flex; flex-direction: column; line-height: 1.25; text-align: left;
      min-width: 0;
    }
    .cspc-institutional .text strong {
      font-size: 0.9rem; font-weight: 700; letter-spacing: -.005em;
      color: #0B1220;
      white-space: nowrap;
    }
.cspc-institutional .text span {
      font-size: .72rem; color: #475569; font-weight: 500; letter-spacing: .01em;
      white-space: nowrap;
    }
.login-split {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      position: relative;
      z-index: 2;
      margin: 0 auto 0 0;
    }
    @media (max-width: 1600px) {
      .login-split { margin-left: 0; }
    }

    /* ---- Right column: RoomSync logo_wm.png — RIGHT-CENTER, NO CONTAINER BOX.
            User request:
              • Use logo_wm.png (not logo.png)
              • Position: right-center of the hero
              • Remove the container box → no frame, no border, no shadow,
                no rounded corners, no decorative halo blob. Just the image.
            ---------------------------------------------------------------- */
    .login-right {
      grid-area: right;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      pointer-events: none;
      min-height: 0;
      height: 100%;
      overflow: visible;
    }
    .rs-logo-stage {
      width: 100%;
      max-width: 480px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
    }
    .rs-logo-stage::before { display: none !important; }

    .rs-logo-frame {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 480px;
      height: auto;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      filter: none;
    }
    .rs-logo-frame img {
      width: 100%;
      height: auto;
      max-height: min(420px, calc(100dvh - 180px));
      max-width: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 22px 42px rgba(15, 39, 70, 0.22))
              drop-shadow(0 8px 18px rgba(15, 39, 70, 0.10));
    }
/* Old auth-brand-row (inside the form card) is no longer used — it
       was moved to `.cspc-institutional`. Hide it if rendered. */
    .auth-brand-row { display: none !important; }
    /* Old inline visual header lock: no longer needed — logo lives in .login-right.
       Kept hidden but still rendered so auth.js form bindings remain valid. */
    .auth-visual-header { display: none !important; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(18, 53, 91, 0.06);
      border: 1px solid rgba(18, 53, 91, 0.14);
      color: #1E3A8A; font-size: .72rem; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
      padding: 5px 9px; border-radius: 999px;
      margin: 0 0 var(--space-4) 0;
      width: fit-content;
    }
    .eyebrow::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

.login-title {
      font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.06;
      letter-spacing: -.022em; margin: 0 0 14px;
      color: #0B1220; font-weight: 800;
    }
    .login-title .accent {
      background: linear-gradient(120deg, #0F2746, #2563EB 58%, #12355B);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

.login-lead {
      font-size: 1.02rem; color: #334155; max-width: 48ch;
      margin: 0 0 18px; line-height: 1.7;
    }
/* Feature bullets under copy — upgraded for white-BG legibility */
    .login-perks {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 0 0;
      border-top: 1px solid #E2E8F0;
      margin: 0;
    }
.perk {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      background: rgba(18, 53, 91, 0.025);
      border: 1px solid rgba(18, 53, 91, 0.08);
      border-radius: 9px;
      transition: background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }
    .perk:hover {
      background: rgba(37, 99, 235, 0.055);
      border-color: rgba(37, 99, 235, 0.18);
      transform: translateY(-1px);
    }
.perk-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #E0EEFF, #C7DCFF 40%, #12355B);
      color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; font-size: .82rem;
      box-shadow: 0 1px 0 rgba(255,255,255,.85) inset, 0 2px 8px -4px rgba(18,53,91,.25);
    }
.perk-text strong { display: block; font-size: .84rem; font-weight: 800; color: #0B1220; letter-spacing: -.005em; }
.perk-text span { font-size: .74rem; color: #475569; line-height: 1.4; }
/* ================= AUTH FORM SECTION — NO CONTAINER BOX  =================
       The previous `.login-auth-wrap` card (border / shadow / padding / rounded /
       gradient top-bar) is removed. Content sits cleanly on the white page,
       visually bounded by generous spacing and subtle section dividers instead.
       ======================================================================== */
    .login-auth-wrap {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: var(--space-5) 0 0 0;
      box-shadow: none;
      position: relative;
      overflow: visible;
      border-top: 2px solid #12355B;
      width: 100%;
    }
.login-auth-wrap::before { display: none; }

    /* --- Institutional trust strip: tighter, no separator card style --- */
    .auth-brand-row {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 12px; margin: 0 0 var(--space-5) 0;
      padding: 0;
      border-bottom: none;
    }
    .auth-brand-seal {
      width: 36px; height: 36px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(18, 53, 91, 0.05);
      border: 1px solid rgba(18, 53, 91, 0.12);
      overflow: hidden; flex-shrink: 0;
      box-shadow: none;
    }
.auth-brand-seal img { width: 66%; height: 66%; object-fit: contain; }
    .auth-brand-text {
      display: flex; flex-direction: column; line-height: 1.2;
      text-align: left;
    }
    .auth-brand-text strong {
      font-size: .84rem; font-weight: 800; letter-spacing: -.005em;
      color: #0B1220;
    }
.auth-brand-text span {
      font-size: .72rem; color: #475569; font-weight: 500;
      letter-spacing: .01em;
    }
/* Header: left-aligned, compact — sits on the white page like a sub-heading */
    .auth-visual-header {
      display: flex; flex-direction: row; align-items: center;
      margin-bottom: var(--space-5);
      text-align: left;
      gap: 14px;
      justify-content: flex-start;
    }
    .auth-brand-lock {
      width: 54px; height: 54px;
      border-radius: 14px;
      background: linear-gradient(140deg, #FFFFFF 0%, #F8FAFC 100%);
      border: 1px solid rgba(18, 53, 91, 0.12);
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.85) inset,
        0 6px 16px -10px rgba(18, 53, 91, .25);
      position: relative;
      flex-shrink: 0;
    }
.auth-brand-lock img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .auth-brand-lock::after {
      content: ""; position: absolute;
      bottom: -3px; right: -3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #059669);
      border: 3px solid #F8FAFC;
      box-shadow: 0 3px 6px rgba(5, 150, 105, .25);
    }
.login-auth-wrap h2 {
      font-size: 1.55rem; margin: 0; letter-spacing: -.018em;
      font-weight: 800; color: #0B1220; line-height: 1.15;
    }
.login-auth-wrap p.auth-sub {
      color: #475569; font-size: .88rem; margin: 4px 0 0 0;
      line-height: 1.5;
    }
.auth-visual-header > :last-child { flex: 1; min-width: 0; }

    /* Email-domain hint: subtle informational rule, not a flashy box */
    .auth-email-hint {
      display: inline-flex; align-items: center; justify-content: flex-start;
      gap: 8px;
      background: rgba(37, 99, 235, 0.05);
      border: 1px solid rgba(37, 99, 235, 0.12);
      border-radius: 8px; padding: 7px 12px; margin: 0 0 var(--space-4) 0;
      font-size: .75rem; color: #1E3A8A; font-weight: 600;
      width: fit-content; max-width: 100%;
      box-shadow: 0 1px 0 rgba(255,255,255,.6) inset;
    }
.auth-email-hint .email-icon { font-size: .9rem; line-height: 1; opacity: .9; }

    /* --- Form fields — cleaner, institutional white-page styling --- */
    .form {
      display: flex; flex-direction: column; gap: var(--space-4);
      width: 100%;
    }
    .form .field {
      display: flex; flex-direction: column; gap: 6px;
      position: relative;
      width: 100%;
    }
    .form label {
      font-size: .80rem; font-weight: 700; color: #0F2746;
      letter-spacing: .02em; text-transform: none;
      line-height: 1.2;
    }
.form .input-wrap { position: relative; width: 100%; }
    .form .input-wrap .field-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #64748B; font-size: .92rem; line-height: 1; pointer-events: none;
      display: inline-flex; align-items: center;
    }
.form .input-wrap .toggle-pass {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: transparent; color: #64748B; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .form .input-wrap .toggle-pass svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.form .input-wrap .toggle-pass:hover {
      background: rgba(18,53,91,0.06); color: #0F172A;
    }
.form .input-wrap .toggle-pass:focus-visible {
      outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.22);
    }
    .form input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      border-radius: 9px;
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      font-size: .92rem; font-family: inherit; color: #0B1220; font-weight: 500;
      transition: border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03) inset;
      line-height: 1.4;
      height: auto;
      box-sizing: border-box;
    }
.form input.has-suffix { padding-right: 46px; }
    .form input::placeholder { color: #94A3B8; font-weight: 400; }
.form input:hover { border-color: #94A3B8; }
.form input:focus {
      outline: none; border-color: #2563EB;
      box-shadow:
        0 0 0 4px rgba(37, 99, 235, .12),
        0 1px 2px rgba(15, 23, 42, 0.03) inset;
      background: #FFFFFF;
    }
.form input:invalid:not(:placeholder-shown),
    .form input.error {
      border-color: #DC2626;
      background: #FEF2F2;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .12);
    }
.form-actions {
      display: flex; gap: var(--space-3); align-items: stretch;
      flex-wrap: wrap;
      margin-top: var(--space-2);
      width: 100%;
    }

    .btn.primary.large {
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: 700;
      font-size: .93rem;
      letter-spacing: .005em;
      background: linear-gradient(180deg, #12355B 0%, #0F2746 100%);
      border-color: rgba(15, 39, 70, 1);
      color: #FFFFFF;
      box-shadow:
        0 1px 0 rgba(255,255,255,.14) inset,
        0 8px 20px -12px rgba(15, 39, 70, .55);
      transition: transform .14s var(--ease), box-shadow .2s var(--ease), filter .18s var(--ease);
      min-height: 48px;
    }
    .btn.primary.large:hover {
      filter: brightness(1.06);
      box-shadow:
        0 1px 0 rgba(255,255,255,.14) inset,
        0 12px 26px -14px rgba(15, 39, 70, .65);
    }
    .btn.primary.large:active {
      transform: translateY(1px);
      filter: brightness(0.98);
    }
.login-alt {
      margin-top: var(--space-5);
      padding-top: var(--space-4);
      border-top: 1px solid #E2E8F0;
      text-align: left;
      width: 100%;
    }
.login-alt p { margin: 0; font-size: .84rem; color: #475569; line-height: 1.5; }
.login-alt a {
      color: #12355B; font-weight: 800; text-decoration: none;
      transition: color .18s var(--ease);
    }
    .login-alt a:hover { color: #2563EB; text-decoration: underline; text-underline-offset: 2px; }

/* Role preview badges: reduced visual weight, left-aligned, more muted */
    .role-preview {
      display: flex; justify-content: flex-start; align-items: center;
      gap: 8px;
      margin-top: var(--space-4);
      padding-top: 0;
      border-top: none;
      flex-wrap: wrap;
      opacity: .88;
      width: 100%;
    }
    .role-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 6px;
      font-size: .70rem; font-weight: 700; letter-spacing: .02em;
      background: rgba(18, 53, 91, 0.04);
      border: 1px solid rgba(18, 53, 91, 0.10);
      color: #0F2746;
      line-height: 1.3;
      white-space: nowrap;
    }
.role-chip::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .role-chip:nth-child(2)::before { background: var(--navy-700); }
    .role-chip:nth-child(3)::before { background: var(--success); }
    .role-chip:nth-child(4)::before { background: var(--warning); }

    /* Hero entrance animation (staggered) */
    .hero-entrance { opacity: 0; transform: translateY(16px); }
    .hero-entrance.visible {
      animation: hero-up .7s var(--ease) both;
    }
    .hero-entrance.d1 { animation-delay: .05s; }
    .hero-entrance.d2 { animation-delay: .12s; }
    .hero-entrance.d3 { animation-delay: .2s; }
    .hero-entrance.d4 { animation-delay: .28s; }
    .hero-entrance.d5 { animation-delay: .36s; }
    .hero-entrance.d6 { animation-delay: .44s; }
    @keyframes hero-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ----------------------------------------------------------------
       5. FOOTER (same as landing)
       ---------------------------------------------------------------- */
    .landing-footer {
      position: relative; z-index: 2;
      border-top: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(11, 18, 32, 0.94);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
.landing-footer-inner {
      max-width: 1180px; margin: 0 auto; padding: 40px var(--space-5) 0;
    }
    .footer-grid {
      display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px;
      padding-bottom: 32px;
    }
    .footer-col h4 {
      font-size: .85rem; font-weight: 700; margin-bottom: 14px;
      color: #F8FAFC; letter-spacing: .02em;
    }
.footer-col p {
      font-size: .88rem; color: #94A3B8; line-height: 1.6; margin: 0 0 12px;
    }
.footer-col ul {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .footer-col ul li a {
      text-decoration: none; color: #94A3B8; font-size: .88rem;
      transition: color .18s var(--ease);
    }
.footer-col ul li a:hover { color: #FFFFFF; }
.footer-brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .footer-brand .brand-text { font-size: 1rem; color: #F8FAFC; font-weight: 800; }
.footer-bottom {
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      padding: 18px var(--space-5) 12px;
      max-width: 1180px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      font-size: .82rem; color: #94A3B8;
    }
/* ----------------------------------------------------------------
       6. REDUCED MOTION
       ---------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
      .hero-entrance { opacity: 1; transform: none; }
      .blob { animation: none !important; }
    }

    /* ----------------------------------------------------------------
       7. RESPONSIVE
       ---------------------------------------------------------------- */
    @media (max-width: 1100px) {
      /* Tighten the white left panel earlier so image still shows on narrower desktops */
      body::after {
        background-image:
          linear-gradient(
            90deg,
            #F8FAFC 0%,
            #F8FAFC 62%,
            rgba(248, 250, 252, 0.88) 68%,
            rgba(248, 250, 252, 0.50) 74%,
            rgba(248, 250, 252, 0.16) 82%,
            rgba(248, 250, 252, 0) 90%,
            rgba(248, 250, 252, 0) 100%
          ),
          url('../assets/images/bg.jpg');
      }
.login-hero {
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
        column-gap: var(--space-6);
        padding: 20px var(--space-5) 20px;
      }
      .login-left { padding-top: 80px; }
      .login-split { max-width: 480px; gap: var(--space-5); }
      .rs-logo-stage { max-width: 420px; }
      .rs-logo-frame { max-width: 420px; }
      .rs-logo-frame img { max-height: min(420px, calc(100dvh - 140px)); }
    }

    @media (max-width: 960px) {
      /* Collapse image area & RIGHT LOGO column. Single column layout. */
      body::after {
        background-image:
          linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
      }
body::before { background: none; }
      .blob { display: none; }

      html, body { overflow: auto; height: auto; max-height: none; }
      .splash-wrap {
        height: auto;
        min-height: 100dvh;
        max-height: none;
        overflow: visible;
      }
      .login-hero {
        grid-template-columns: 1fr;
        grid-template-areas: "right" "left";
        padding: 24px var(--space-5) 32px;
        height: auto;
        min-height: 100dvh;
        overflow: visible;
        column-gap: 0;
        row-gap: var(--space-5);
        max-width: 640px;
        margin: 0 auto;
      }
      .login-left { padding-top: 0; padding-bottom: 0; }

      .cspc-institutional { display: none !important; }
      .auth-brand-row { display: flex !important; }
      .auth-visual-header { display: none !important; }

      .login-split { max-width: 100%; margin: 0 auto; gap: var(--space-5); }
      .login-perks { grid-template-columns: 1fr 1fr; }

      /* Drop the right column above the form. Keep box-free, compact wordmark
         above the fold so branding still shows on tablets. */
      .login-right {
        order: -1;
        padding: var(--space-3) 0 var(--space-2) 0;
        pointer-events: none;
        min-height: 0;
        height: auto;
      }
      .rs-logo-stage { max-width: 320px; }
      .rs-logo-frame {
        width: 100%; max-width: 320px; height: auto; padding: 0;
        background: transparent; border: none; border-radius: 0;
        box-shadow: none;
      }
      .rs-logo-frame img {
        max-height: 220px;
        filter: drop-shadow(0 14px 28px rgba(15, 39, 70, .16));
      }
.rs-logo-stage::before { display: none !important; }
    }
    @media (max-width: 640px) {
      html { scroll-padding-top: 0; }
      body { padding-top: 0; background: #F8FAFC; }
      .login-hero {
        min-height: 100dvh;
        padding: 20px 16px 28px;
        row-gap: var(--space-4);
      }
      .login-auth-wrap { padding-top: var(--space-4); }
      .login-perks { grid-template-columns: 1fr; }
      .login-left { padding-top: 0; }
      .login-split { gap: var(--space-4); }
      .login-right { padding: var(--space-2) 0 var(--space-1) 0; }
      .rs-logo-stage { max-width: 220px; }
      .rs-logo-frame {
        max-width: 220px;
        border-radius: 0;
        padding: 0;
      }
      .rs-logo-frame img { max-height: 160px; }
      .login-title { font-size: clamp(1.85rem, 7.5vw, 2.4rem); }
      .form { gap: var(--space-3); }
      .form input { padding: 11px 13px 11px 36px; }
      .form input.has-suffix { padding-right: 44px; }
    }
    @media (max-width: 480px) {
      .login-title { font-size: 1.85rem; }
      .login-hero { padding: 16px 14px 24px; min-height: 100dvh; }
      .login-split { gap: var(--space-4); }
      .rs-logo-stage { max-width: 180px; }
      .rs-logo-frame { max-width: 180px; }
      .rs-logo-frame img { max-height: 130px; }
      .login-auth-wrap { padding-top: var(--space-3); }
      .role-preview { gap: 6px; }
      .role-chip { padding: 4px 9px; font-size: .68rem; }
      .eyebrow { font-size: .72rem; padding: 5px 11px; }
    }
  </style>
</head>
<body>
  <div id="app" class="splash-wrap" style="position:relative">
    <span class="blob b1"></span>
    <span class="blob b2"></span>

    <!-- ============================================================
         LOGIN HERO — TWO-COLUMN LAYOUT
         LEFT : CSPC strip (top-left) + copy stack + form (vertically centered)
         RIGHT: Larger RoomSync logo (right-center of hero)
         ============================================================ -->
    <section class="login-hero">
      <!-- ===================== LEFT PANEL ===================== -->
      <div class="login-left">
        <!-- CSPC institutional block pinned to TOP-LEFT of left panel -->
        <div class="cspc-institutional" aria-hidden="true">
          <div class="seal" title="Camarines Sur Polytechnic Colleges">
            <img src="../assets/images/cspc-logo.png" alt="CSPC Seal" loading="eager" decoding="async">
          </div>
          <div class="text">
            <strong>Camarines Sur Polytechnic Colleges</strong>
            <span>College of Computer Studies · Official Portal</span>
          </div>
        </div>

        <div class="login-split">
          <!-- Intro copy stack -->
          <div class="login-copy">
            <span class="eyebrow hero-entrance d1">Void Syndicate</span>
            <h1 class="login-title hero-entrance d2">
              <span class="accent">Sign in to RoomSync.</span>
            </h1>
          </div>

          <!-- Form block (old auth-brand-row + auth-visual-header are hidden) -->
          <div class="login-auth-wrap hero-entrance d5">
            <div class="auth-brand-row" aria-hidden="true">
              <div class="auth-brand-seal" title="Camarines Sur Polytechnic Colleges">
                <img src="../assets/images/cspc-logo.png" alt="CSPC Seal" loading="eager" decoding="async">
              </div>
              <div class="auth-brand-text">
                <strong>Camarines Sur Polytechnic Colleges</strong>
                <span>College of Computer Studies</span>
              </div>
            </div>

            <div class="auth-visual-header">
              <div class="auth-brand-lock" title="RoomSync — Secure Sign In">
                <img src="../assets/logos/logo_wm.png" alt="RoomSync Logo" loading="eager" decoding="async">
              </div>
            </div>

            <form id="login-form" class="form" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <div class="input-wrap">
                  <input type="email" id="login-email" name="email" required
                         placeholder="your.name@my.cspc.edu.ph" autocomplete="email"
                         pattern="[A-Za-z0-9._%+\-]+@(my\.)?cspc\.edu\.ph$">
                </div>
              </div>

              <div class="field">
                <label for="login-password">Password</label>
                <div class="input-wrap">
                  <input type="password" id="login-password" name="password"
                         required placeholder="••••••••" autocomplete="current-password"
                         minlength="4" class="has-suffix">
                  <button type="button" class="toggle-pass" id="toggle-pass"
                          aria-label="Show password" aria-pressed="false" title="Show password">
                    <svg class="password-eye-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="password-eye-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"/></svg>
                  </button>
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn primary large" style="flex:1;justify-content:center;gap:8px">
                  <span>Sign In</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- ===================== RIGHT PANEL ===================== -->
      <!-- RoomSync logo_wm.png — right-center of hero, NO container box. -->
      <div class="login-right" aria-hidden="true">
        <div class="rs-logo-stage hero-entrance d2">
          <div class="rs-logo-frame">
            <img src="../assets/logos/logo_wm.png" alt="RoomSync — Room & Laboratory Scheduling System Wordmark" loading="eager" decoding="async">
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    /* ==================================================================
       Login Page — Navigation, entrance, auth UX enhancements
       ================================================================== */
    (function () {
      'use strict';

      /* --- Year in footer --- */
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      /* --- Mobile nav toggle --- */
      const landingToggle = document.querySelector('.landing-toggle');
      const landingMenu = document.getElementById('landing-nav-menu');
      if (landingToggle && landingMenu) {
        landingToggle.addEventListener('click', () => {
          const open = landingMenu.classList.toggle('open');
          landingToggle.setAttribute('aria-expanded', String(open));
        });
        landingMenu.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', () => {
            landingMenu.classList.remove('open');
            landingToggle.setAttribute('aria-expanded', 'false');
          });
        });
        /* Close on Escape */
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && landingMenu.classList.contains('open')) {
            landingMenu.classList.remove('open');
            landingToggle.setAttribute('aria-expanded', 'false');
            landingToggle.focus();
          }
        });
      }

      /* --- Sticky nav glass effect on scroll --- */
      const nav = document.getElementById('landing-nav');
      if (nav) {
        const onScroll = () => {
          nav.classList.toggle('scrolled', window.scrollY > 20);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      /* --- Immediate hero entrance (no splash) --- */
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const runEntrance = () => {
        document.querySelectorAll('.hero-entrance').forEach(el => {
          el.classList.add('visible');
        });
      };
      if (prefersReducedMotion) {
        runEntrance();
      } else {
        requestAnimationFrame(() => requestAnimationFrame(runEntrance));
      }

      /* --- Show / Hide Password toggle --- */
      const togglePassBtn = document.getElementById('toggle-pass');
      const passInput = document.getElementById('login-password');
      if (togglePassBtn && passInput) {
        const eyeShow = togglePassBtn.querySelector('.password-eye-show');
        const eyeHide = togglePassBtn.querySelector('.password-eye-hide');
        togglePassBtn.addEventListener('click', () => {
          const isHidden = passInput.type === 'password';
          passInput.type = isHidden ? 'text' : 'password';
          eyeShow.hidden = isHidden;
          eyeHide.hidden = !isHidden;
          togglePassBtn.setAttribute('aria-pressed', String(isHidden));
          togglePassBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
          togglePassBtn.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
        });
      }

      /* --- Already-logged-in fast path: redirect immediately --- */
      const loggedIn = !!(localStorage.getItem('rr_token') && localStorage.getItem('rr_user'));
      if (loggedIn) {
        if (window.showToast) window.showToast('info', 'Welcome back', 'Redirecting to your dashboard…');
        setTimeout(() => { location.href = 'dashboard.html'; }, 350);
      }

    })();
  </script>
</body>
</html>
