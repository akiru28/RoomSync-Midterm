<div id="reserve-modal" class="modal" aria-hidden="true">
  <div class="modal-panel">
    <header class="modal-header">
      <div style="display:flex;flex-direction:column;gap:var(--space-2);min-width:0">
        <span class="section-label">Request · New Booking</span>
        <h2 style="margin:0">Reserve Room / Lab</h2>
      </div>
      <button class="modal-close" type="button" onclick="closeModal('reserve-modal')" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <form id="modal-reserve-form" class="form" novalidate>
        <div class="field">
          <label for="modal-room-select">Room / Lab</label>
          <div class="input-wrap">
            <select name="room_id" required id="modal-room-select">
              <option value="">Select a room…</option>
              <option value="1">Lab A - Room 101 (24 pax)</option>
              <option value="2">Lab B - Room 102 (30 pax)</option>
              <option value="3">Room C - 203 (12 pax)</option>
              <option value="4">Lab D - Room 205 (20 pax)</option>
              <option value="5">Lecture Hall 301 (80 pax)</option>
              <option value="6">Seminar Room 302 (18 pax)</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="modal-purpose">Purpose</label>
          <div class="input-wrap">
            <input id="modal-purpose" name="purpose" placeholder="e.g. Meeting, Class, Project Work" required>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)">
          <div class="field">
            <label for="modal-start">Start</label>
            <div class="input-wrap">
              <input id="modal-start" type="datetime-local" name="start_time" required>
            </div>
          </div>
          <div class="field">
            <label for="modal-end">End</label>
            <div class="input-wrap">
              <input id="modal-end" type="datetime-local" name="end_time" required>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="modal-attendees">Expected attendees</label>
          <div class="input-wrap">
            <input id="modal-attendees" type="number" name="attendees" min="1" value="1">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn primary" type="submit">Submit Request</button>
          <button type="button" class="btn ghost" onclick="closeModal('reserve-modal')">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
